<body>

<div class="container">

<h1>🏠 House Price Estimator</h1>

<form action="/predict" method="POST">

<label>Area (sq ft)</label><br>
<input type="number" name="area" required><br><br>

<label>Bedrooms</label><br>
<input type="number" name="bedrooms" required><br><br>

<label>Bathrooms</label><br>
<input type="number" name="bathrooms" required><br><br>

<label>House Age</label><br>
<input type="number" name="age" required><br><br>

<button type="submit">Predict Price</button>

</form>

{% if prediction %}
<h2>{{ prediction }}</h2>
{% endif %}

</div>

</body>
</html>
